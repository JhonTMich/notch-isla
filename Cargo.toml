[package]
name = "notch-isla"
version = "0.1.0"
edition = "2021"
description = "Isla dinámica minimalista para Windows, enfocada en controlar la música."

[dependencies]
# Rasterizador 2D en Rust puro (anti-aliasing, curvas). Sin soporte PNG para mantenerlo liviano.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
